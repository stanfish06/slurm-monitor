name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Tier one: recorded fixtures. Client-only install; never builds pyslurm or the extension.
  fixtures:
    name: fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -q -m "not pyslurm and not cluster"

  # Tier two: real pyslurm against nixpkgs Slurm 25.11.6 from the flake devShell.
  pyslurm:
    name: pyslurm (ubuntu-latest, nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # The devShell's shellHook exports SLURM_INCLUDE_DIR, SLURM_LIB_DIR, CC and LD_LIBRARY_PATH.
      - run: nix develop -c sh -c "grep SLURM_VERSION_NUMBER \"\$SLURM_INCLUDE_DIR\"/slurm/slurm_version.h"
      - run: nix develop -c uv sync --extra agent --group dev
      # libslurm aborts at import without a slurm.conf; a stub is enough with no controller present.
      - run: |
          printf 'ClusterName=ci\nSlurmctldHost=localhost\n' > "$RUNNER_TEMP/slurm.conf"
          echo "SLURM_CONF=$RUNNER_TEMP/slurm.conf" >> "$GITHUB_ENV"
      - run: nix develop -c uv run python -c "import pyslurm; print(pyslurm.__version__, pyslurm.slurm_api_version())"
      # tests/test_pyslurm_tier.py compiles the extension against the devShell's Slurm and checks versions.
      - run: nix develop -c uv run pytest -q -m pyslurm
